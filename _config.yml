title: "Yicheng Ma"
author: "Yicheng Ma"
description: "Yicheng Ma — researcher in robot learning and robotic manipulation"
url: "https://yicheng-ma.github.io"
baseurl: ""
github_username: "yichatani"

header_pages:
  - blog.md
  - archive.md

#### bundle exec jekyll serve

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
# email: "example@mail.com"
# twitter_username: "twitteruser"
# github_username: "githubuser"
# linkedin_username: "linkedinuser"
#facebook_username: username
#flickr_username: username
#instagram_username: username
#pinterest_username: username
#youtube_username: username
#googleplus_username: +username

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Ordinary JPEGs in posts are converted into responsive display copies at build time.
# The source image remains untouched and opens at full resolution when clicked.
responsive_images:
  widths: [800, 1600, 2400]
  quality: 92
  sizes: "(max-width: 800px) calc(100vw - 30px), 740px"

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      tags: Other
